# FABRI-CORE · build en un teléfono (7,5 GB RAM): todo acotado y en un solo proceso.
org.gradle.jvmargs=-Xmx900m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.daemon=false
org.gradle.vfs.watch=false

# El compilador de Kotlin dentro del daemon: evita el daemon aparte (~500 MB)
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx512m

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
kotlin.code.style=official

# IPv6 es un black hole en esta red: la JVM debe ir por IPv4
systemProp.java.net.preferIPv4Stack=true
systemProp.java.net.preferIPv4Addresses=true

# El agente de instrumentación de AGP transforma TODAS las dependencias: es la parte
# más lenta del build en un teléfono. Desactivado (solo afecta al bytecode de las deps).
org.gradle.internal.instrumentation.agent=false
# NOTA: org.gradle.configuration-cache y configure-on-demand se desactivaron a mano:
# en este teléfono la fase de configuración se eternizaba (>20 min) y el kernel mataba
# el daemon. Con la caché de dependencias y --offline, el build va directo a la tarea.
