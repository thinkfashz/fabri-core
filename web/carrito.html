<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FORGE CORE STOCK · Carrito</title>
<meta name="description" content="Tu carrito de compra en FORGE CORE STOCK: cantidades, descuento de oferta y total antes de pagar.">
<meta name="theme-color" content="#08090A">
<link rel="stylesheet" href="./components.css">
<link rel="stylesheet" href="./tienda.css">
</head>
<body data-pg="carrito">

<div class="aurora" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>
<div id="fcs-nav"></div>

<main class="ti-main ti-main--estrecho ti-entrada">

  <section class="ti-hero">
    <div class="ti-hero-txt">
      <p class="ti-eyebrow">Paso 4 · tu pedido</p>
      <h1>Carrito</h1>
      <p class="ti-sub">Se guarda en este dispositivo: puedes cerrar la página y volver después.</p>
    </div>
  </section>

  <section class="ds-kpi-grid" aria-label="Resumen del carrito">
    <div class="ds-stat">
      <span class="ds-stat__label">Unidades</span>
      <span class="ds-stat__value" id="kpUn">0</span>
      <span class="ds-stat__meta" id="kpItems">0 productos</span>
    </div>
    <div class="ds-stat">
      <span class="ds-stat__label">Total</span>
      <span class="ds-stat__value ds-stat__value--accent" id="kpTotal">$0</span>
      <span class="ds-stat__meta">con oferta aplicada</span>
    </div>
  </section>

  <section class="ds-card" id="caLista" aria-live="polite">
    <div class="ds-skeleton ds-skeleton--line"></div>
    <div class="ds-skeleton ds-skeleton--line"></div>
    <div class="ds-skeleton ds-skeleton--line"></div>
  </section>

  <section class="ds-card" id="caResumen" hidden>
    <p class="ti-eyebrow">Resumen</p>
    <div class="ti-resumen" id="caDetalle"></div>
    <div class="ti-total"><span>Total a pagar</span><b id="caTotal">$0</b></div>
    <div class="ti-pie-accion">
      <a class="ds-btn ds-btn--secondary" href="tienda.html">Seguir comprando</a>
      <a class="ds-btn" href="checkout.html">Continuar al pago</a>
    </div>
    <button class="ds-btn ds-btn--danger ds-btn--block ds-btn--sm" id="caVaciar" type="button" style="margin-top:10px">Vaciar carrito</button>
  </section>

</main>

<footer class="ti-pie">
  <span>FORGE CORE STOCK · carrito</span>
  <span>Pago de demostración · sin movimiento de dinero real</span>
</footer>

<div class="ti-toast" id="tiToast"></div>

<script src="./tienda-nucleo.js"></script>
<script src="./tienda-carrito.js"></script>
</body>
</html>
