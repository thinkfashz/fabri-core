<!doctype html>
<html lang="es-CL" data-panel="cliente">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08090A">
  <title>Reseñas · FORGE CORE STOCK</title>
  <meta name="description" content="Califica los pedidos entregados y revisa lo que ya opinaste.">
  <link rel="icon" href="/favicon.png">
  <link rel="stylesheet" href="/components.css">
  <link rel="stylesheet" href="/panel/comun/shell.css">
  <link rel="stylesheet" href="./resenas.css">
</head>
<body data-panel="cliente" data-modulo="resenas" data-layout="bandeja">
  <a class="skip" href="#contenido">Saltar al contenido</a>
  <aside class="sidebar" id="sidebar" aria-label="Navegación del cliente"></aside>
  <div class="shell-backdrop" hidden data-cerrar-sidebar></div>

  <header class="topbar">
    <button class="topbar__menu" type="button" data-abrir-sidebar aria-label="Abrir menú" aria-controls="sidebar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="topbar__id">
      <span class="topbar__kicker">Panel Cliente</span>
      <span class="topbar__title">Reseñas</span>
    </div>
    <div class="topbar__right">
      <a class="cuenta-chip" href="/panel/cliente/cuenta/" data-cuenta-chip aria-label="Tu cuenta"></a>
    </div>
  </header>

  <main id="contenido" class="page page--textura">
    <div data-aviso aria-live="polite"></div>

    <header class="res-cabeza">
      <div>
        <span class="res-cabeza__kicker">Tu opinión</span>
        <h1>Reseñas</h1>
        <p>Califica los pedidos que ya llegaron. Tu nombre se muestra abreviado; el teléfono nunca.</p>
      </div>
      <a class="ds-btn ds-btn--ghost ds-btn--sm" href="/panel/cliente/pedidos/">Mis pedidos</a>
    </header>

    <section class="res-seccion" aria-labelledby="resPendientesTitulo">
      <div class="res-seccion__cabeza">
        <h2 id="resPendientesTitulo">Pendientes de calificar</h2>
        <span class="pill pill--acento" data-n-pendientes>0</span>
      </div>
      <div data-pendientes aria-live="polite">
        <div class="ds-skeleton" style="height:160px;border-radius:18px"></div>
      </div>
    </section>

    <section class="res-seccion" aria-labelledby="resHistorialTitulo">
      <div class="res-seccion__cabeza">
        <h2 id="resHistorialTitulo">Lo que ya opinaste</h2>
        <span class="pill" data-n-resenas>0</span>
      </div>
      <div data-historial aria-live="polite">
        <div class="ds-skeleton" style="height:92px;border-radius:16px;margin-bottom:9px"></div>
        <div class="ds-skeleton" style="height:92px;border-radius:16px"></div>
      </div>
    </section>
  </main>

  <script type="module" src="/panel/comun/shell.js"></script>
  <script type="module" src="./resenas.js"></script>
</body>
</html>
