<!doctype html>
<html lang="es-CL" data-panel="cliente">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08090A">
  <title>Favoritos · FORGE CORE STOCK</title>
  <meta name="description" content="Los productos y las tiendas que guardaste, con su precio de hoy.">
  <link rel="icon" href="/favicon.png">
  <link rel="stylesheet" href="/components.css">
  <link rel="stylesheet" href="/panel/comun/shell.css">
  <link rel="stylesheet" href="./favoritos.css">
</head>
<body data-panel="cliente" data-modulo="favoritos" data-layout="guardados">
  <a class="skip" href="#contenido">Saltar al contenido</a>
  <aside class="sidebar" id="sidebar" aria-label="Navegación del cliente"></aside>
  <div class="shell-backdrop" hidden data-cerrar-sidebar></div>

  <header class="topbar">
    <button class="topbar__menu" type="button" data-abrir-sidebar aria-label="Abrir menú" aria-controls="sidebar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="topbar__id">
      <span class="topbar__kicker">Panel Cliente</span>
      <span class="topbar__title">Favoritos</span>
    </div>
    <div class="topbar__right">
      <a class="cuenta-chip" href="/panel/cliente/cuenta/" data-cuenta-chip aria-label="Tu cuenta"></a>
    </div>
  </header>

  <main id="contenido" class="page page--textura">
    <div data-aviso aria-live="polite"></div>

    <header class="fav-cabeza">
      <div>
        <span class="fav-cabeza__kicker">Guardados</span>
        <h1>Favoritos</h1>
        <p>Lo que te gustó, con el precio y el stock que tiene hoy la tienda.</p>
      </div>
      <a class="ds-btn ds-btn--ghost ds-btn--sm" href="/panel/cliente/buscar/">Seguir buscando</a>
    </header>

    <div class="fav-barra">
      <div class="fav-seg" role="tablist" aria-label="Tipo de favorito">
        <button type="button" role="tab" data-tab="producto" aria-selected="true">Productos <span data-n-producto>0</span></button>
        <button type="button" role="tab" data-tab="tienda" aria-selected="false">Tiendas <span data-n-tienda>0</span></button>
      </div>
      <button class="ds-btn ds-btn--secondary ds-btn--sm" type="button" data-sincronizar hidden>
        Subir los de este teléfono
      </button>
    </div>

    <div class="fav-marco" data-marco>
      <section class="fav-lista" data-lista aria-live="polite">
        <div class="ds-skeleton" style="height:82px;border-radius:16px;margin-bottom:9px"></div>
        <div class="ds-skeleton" style="height:82px;border-radius:16px;margin-bottom:9px"></div>
        <div class="ds-skeleton" style="height:82px;border-radius:16px"></div>
      </section>

      <aside class="fav-cambios" aria-label="Cambios de precio">
        <div class="fav-cambios__cabeza">
          <h2>Cambios de precio</h2>
          <span class="pill pill--acento" data-bajas>0</span>
        </div>
        <div class="fav-cambios__cuerpo" data-cambios>
          <p class="fav-cambios__nota">Cuando un producto guardado baja de precio, aparece acá con la diferencia real contra lo que costaba al guardarlo.</p>
        </div>
      </aside>
    </div>
  </main>

  <script type="module" src="/panel/comun/shell.js"></script>
  <script type="module" src="./favoritos.js"></script>
</body>
</html>
