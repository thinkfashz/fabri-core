<!doctype html>
<html lang="es-CL" data-panel="cliente">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08090A">
  <title>Buscar · FORGE CORE STOCK</title>
  <meta name="description" content="Busca un producto en todas las tiendas y compara precio, distancia y disponibilidad.">
  <link rel="icon" href="/favicon.png">
  <link rel="stylesheet" href="/components.css">
  <link rel="stylesheet" href="/panel/comun/shell.css">
  <link rel="stylesheet" href="./buscar.css">
</head>
<body data-panel="cliente" data-modulo="buscar" data-layout="comparativo">
  <a class="skip" href="#contenido">Saltar al contenido</a>
  <aside class="sidebar" id="sidebar" aria-label="Navegación del cliente"></aside>
  <div class="shell-backdrop" hidden data-cerrar-sidebar></div>

  <header class="topbar">
    <button class="topbar__menu" type="button" data-abrir-sidebar aria-label="Abrir menú" aria-controls="sidebar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="topbar__id">
      <span class="topbar__kicker">Panel Cliente</span>
      <span class="topbar__title">Buscar</span>
    </div>
    <div class="topbar__right">
      <a class="cuenta-chip" href="/panel/cliente/cuenta/" data-cuenta-chip aria-label="Tu cuenta"></a>
    </div>
  </header>

  <main id="contenido" class="page">
    <div class="buscar-cabeza">
      <div class="buscar-titulo">
        <span class="antetitulo">Todas las tiendas a la vez</span>
        <h1 class="titular titular--sm">¿Qué necesitas?</h1>
      </div>
      <form class="buscador" role="search" data-form>
        <svg class="buscador__ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg>
        <input class="buscador__input" type="search" name="q" data-q autocomplete="off"
          placeholder="Pan, leche, tomate…" aria-label="Buscar productos" enterkeyhint="search">
        <button class="ds-btn ds-btn--sm" type="submit">Buscar</button>
      </form>
      <div class="chips" data-categorias aria-label="Categorías"></div>
      <div class="filtros">
        <div class="filtros__grupo" data-precios aria-label="Precio máximo"></div>
        <label class="filtros__orden">
          <span>Ordenar</span>
          <select data-orden aria-label="Ordenar resultados">
            <option value="cercania">Por cercanía</option>
            <option value="precio">Menor precio</option>
            <option value="precio-desc">Mayor precio</option>
            <option value="nombre">Nombre</option>
          </select>
        </label>
      </div>
    </div>

    <div class="resultado-meta" data-meta aria-live="polite"></div>
    <div data-aviso aria-live="polite"></div>
    <div class="resultados" data-resultados aria-live="polite"></div>
  </main>

  <script type="module" src="/panel/comun/shell.js"></script>
  <script type="module" src="./buscar.js"></script>
</body>
</html>
