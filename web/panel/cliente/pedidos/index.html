<!doctype html>
<html lang="es-CL" data-panel="cliente">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08090A">
  <title>Mis pedidos · FORGE CORE STOCK</title>
  <meta name="description" content="Todo lo que has pedido en el barrio, en este teléfono y en tu cuenta.">
  <link rel="icon" href="/favicon.png">
  <link rel="stylesheet" href="/components.css">
  <link rel="stylesheet" href="/panel/comun/shell.css">
  <link rel="stylesheet" href="./pedidos.css">
</head>
<body data-panel="cliente" data-modulo="pedidos" data-layout="historial" data-detalle="0">
  <a class="skip" href="#contenido">Saltar al contenido</a>
  <aside class="sidebar" id="sidebar" aria-label="Navegación del cliente"></aside>
  <div class="shell-backdrop" hidden data-cerrar-sidebar></div>

  <header class="topbar">
    <button class="topbar__menu" type="button" data-abrir-sidebar aria-label="Abrir menú" aria-controls="sidebar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="topbar__id">
      <span class="topbar__kicker">Panel Cliente</span>
      <span class="topbar__title">Mis pedidos</span>
    </div>
    <div class="topbar__right">
      <a class="cuenta-chip" href="/panel/cliente/cuenta/" data-cuenta-chip aria-label="Tu cuenta"></a>
    </div>
  </header>

  <main id="contenido" class="page page--textura">
    <div data-aviso aria-live="polite"></div>

    <header class="historial-cabeza">
      <div>
        <span class="historial-cabeza__kicker">Tu historial</span>
        <h1>Mis pedidos</h1>
        <p>Todos los pedidos de tu cuenta, más los que quedaron guardados en este teléfono.</p>
      </div>
      <a class="ds-btn ds-btn--ghost ds-btn--sm" href="/panel/cliente/buscar/">Buscar algo nuevo</a>
    </header>

    <div class="historial-barra">
      <div class="historial-buscar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg>
        <input type="search" data-q placeholder="Buscar por código o tienda" aria-label="Buscar pedido por código o tienda">
      </div>
      <div class="historial-filtros" role="group" aria-label="Filtrar pedidos">
        <button class="ds-chip is-active" type="button" data-filtro="todos">Todos</button>
        <button class="ds-chip" type="button" data-filtro="curso">En curso</button>
        <button class="ds-chip" type="button" data-filtro="entregado">Entregados</button>
        <button class="ds-chip" type="button" data-filtro="cancelado">Cancelados</button>
      </div>
    </div>

    <div class="historial-marco" data-marco>
      <div class="historial-lista" data-lista aria-live="polite">
        <div class="ds-skeleton" style="height:74px;border-radius:16px;margin-bottom:10px"></div>
        <div class="ds-skeleton" style="height:74px;border-radius:16px;margin-bottom:10px"></div>
        <div class="ds-skeleton" style="height:74px;border-radius:16px"></div>
      </div>
      <section class="pedido-detalle" data-detalle aria-live="polite" aria-label="Detalle del pedido"></section>
    </div>
  </main>

  <script type="module" src="/panel/comun/shell.js"></script>
  <script type="module" src="./pedidos.js"></script>
</body>
</html>
