[package]
name = "fabrick-core"
version = "0.9.16"
edition = "2021"
description = "Núcleo Rust de FABRI-CORE: configuración, catálogo, historial, logs y diagnóstico"

[lib]
name = "fabrick_core"
crate-type = ["cdylib"]

[dependencies]
# Puente JNI: evita escribir a mano la tabla de funciones de JNIEnv.
jni = "0.21"
# SQLite embebido (compila el amalgamado de SQLite, sin dependencia del sistema).
rusqlite = { version = "0.32", features = ["bundled"] }
# JSON. Ya está en la caché local de cargo, no genera descarga.
serde_json = "1.0"

[profile.release]
opt-level = "s"   # prioriza tamaño: la APK debe quedar chica
lto = true
strip = true
panic = "abort"
codegen-units = 1
