name: APK Rust

# =============================================================================
#  FABRI-CORE · APK real (Rust + Java + WebView), sin Gradle
#  ---------------------------------------------------------------------------
#  Este flujo compila el proyecto que de verdad se instala:
#
#     src-tauri/   núcleo Rust (cdylib ARM64) → libfabrick_core.so
#     runtime/     llama.cpp b11835 + shim JNI (runtime nativo A1)
#     android/     Java (NativeBridge, MainActivity), recursos y assets/www
#     scripts/     compilar.sh (aapt2 → d8 → zip → zipalign → apksigner)
#
#  El workflow antiguo (`apk.yml`) compila el proyecto Kotlin/Gradle legacy y
#  NO produce esta APK. Los dos pueden convivir: este sólo se dispara cuando
#  cambian los directorios del proyecto Rust.
#
#  Por qué sin Gradle: el pipeline ya está probado en el teléfono (Termux +
#  proot) y sólo necesita JDK, build-tools y el NDK. Evita descargar AGP y
#  Kotlin, y tarda minutos en vez de decenas.
# =============================================================================

on:
  push:
    branches: [master, main]
    paths:
      - 'android/**'
      - 'src-tauri/**'
      - 'runtime/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/apk-rust.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'src-tauri/**'
      - 'runtime/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '2'
  ANDROID_COMPILE_SDK: '34'
  ANDROID_BUILD_TOOLS: '34.0.0'
  ANDROID_NDK_VERSION: '26.1.10909125'
  RUST_TARGET: aarch64-linux-android

jobs:
  apk:
    name: APK 0.9.x (aarch64)
    # `ubuntu-latest` migra a Ubuntu 26 desde el 19/10/2026. El pipeline usa
    # herramientas del SDK de Android y un NDK concreto: se fija 24.04 para que
    # una migración de imagen no cambie el resultado de la compilación.
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (platform 34, build-tools 34, NDK)
        uses: android-actions/setup-android@v3

      - name: Instalar paquetes del SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Rust + target ARM64
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Caché de Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ env.RUST_TARGET }}

      - name: Rutas del SDK y del NDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          NDK="$SDK/ndk/${ANDROID_NDK_VERSION}"
          test -d "$NDK" || { echo "no existe el NDK en $NDK"; exit 1; }
          echo "SDK=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "$SDK/build-tools/${ANDROID_BUILD_TOOLS}" >> "$GITHUB_PATH"
          echo "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Keystore de depuración
        run: |
          set -euo pipefail
          KS="$SDK/debug.keystore"
          if [ ! -f "$KS" ]; then
            keytool -genkeypair -v \
              -keystore "$KS" \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -keystore "$KS" -storepass android | head -3

      - name: Pruebas (arranque + lector EAN)
        run: |
          set -euo pipefail
          bash tests/arranque/correr.sh
          node tests/inventario/ean.js

      - name: Compilar la APK
        env:
          SDK: ${{ env.SDK }}
          CACHE_CARGO: ${{ github.workspace }}/.cargo-home
        run: |
          set -euo pipefail
          mkdir -p "$CACHE_CARGO"
          bash scripts/compilar.sh

      - name: Resumen y hash
        run: |
          set -euo pipefail
          APK=$(ls dist/FABRI-CORE-*.apk | tail -1)
          echo "### APK generada" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Campo | Valor |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Archivo | \`$(basename "$APK")\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tamaño | $(stat -c %s "$APK") B |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SHA-256 | \`$(sha256sum "$APK" | cut -d' ' -f1)\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Firma | depuración (no publicar en Play) |" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: FABRI-CORE-apk
          path: dist/FABRI-CORE-*.apk
          if-no-files-found: error
          retention-days: 30
