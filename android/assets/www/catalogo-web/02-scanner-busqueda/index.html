<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<title>FORGE CORE STOCK · Escáner</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <!-- 1 · cabecera + estado vivo -->
  <header class="topbar">
    <a class="icon-btn" href="../01-home-catalogo/" aria-label="Volver al catálogo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg>
    </a>
    <span class="brand">
      <b>FORGE CORE STOCK</b>
      <span class="status"><i class="dot" aria-hidden="true"></i>NÚCLEO ACTIVO</span>
    </span>
    <a class="icon-btn" href="../05-carrito/" aria-label="Carrito, 0 productos">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h2l2.1 9.6a1.6 1.6 0 0 0 1.6 1.3h7.6a1.6 1.6 0 0 0 1.6-1.2L20.5 8H6.4"/><circle cx="10" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg>
      <span class="count">0</span>
    </a>
  </header>

  <!-- progreso 2/8 -->
  <div class="step"><span>PASO 2/8</span><span>ESCANEO</span></div>
  <div class="bar p2" role="progressbar" aria-label="Paso 2 de 8" aria-valuenow="2" aria-valuemin="1" aria-valuemax="8"><i></i></div>

  <main>

    <!-- visor de cámara -->
    <section class="viewport" aria-label="Visor de la cámara">
      <span class="hud hud--tl" aria-hidden="true"></span>
      <span class="hud hud--tr" aria-hidden="true"></span>
      <span class="hud hud--bl" aria-hidden="true"></span>
      <span class="hud hud--br" aria-hidden="true"></span>

      <div class="hud-top">
        <span class="hud-line">CAM_01 · AUTO</span>
        <span class="hud-line hud-line--live"><i class="dot" aria-hidden="true"></i>ESCANEANDO...</span>
      </div>

      <!-- marco neon -->
      <div class="frame">
        <span class="corner corner--tl" aria-hidden="true"></span>
        <span class="corner corner--tr" aria-hidden="true"></span>
        <span class="corner corner--bl" aria-hidden="true"></span>
        <span class="corner corner--br" aria-hidden="true"></span>
        <span class="laser" aria-hidden="true"></span>
      </div>

      <div class="hud-bottom">
        <span class="hud-line">EAN13 · QR · CODE128</span>
        <span class="hud-line">LAT 12ms · 60 FPS</span>
      </div>
    </section>

    <!-- overlay: producto encontrado -->
    <section class="found" aria-live="polite">
      <span class="found-tag">PRODUCTO ENCONTRADO</span>
      <div class="found-row">
        <span class="found-thumb" aria-hidden="true">
          <svg viewBox="0 0 48 48"><path d="M20 6h8v7l4 6v21a4 4 0 0 1-4 4h-8a4 4 0 0 1-4-4V19l4-6z"/><path d="M16 25h16v10H16z"/></svg>
        </span>
        <span class="found-info">
          <b>Aceite Oliva Extra Virgen</b>
          <span class="found-meta">500 ml · ref. AO-500 · stock 12</span>
          <span class="found-price">$6.990 <em>CLP</em></span>
        </span>
        <span class="badge-off">-25%</span>
      </div>
    </section>

    <!-- acciones -->
    <section class="actions">
      <button class="btn" type="button">Buscar</button>
      <button class="btn btn-neon" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h2l2.1 9.6a1.6 1.6 0 0 0 1.6 1.3h7.6a1.6 1.6 0 0 0 1.6-1.2L20.5 8H6.4"/><circle cx="10" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/><path d="M17 5.5h4M19 3.5v4"/></svg>
        Añadir al carrito
      </button>
    </section>

    <p class="foot">Apunta el código dentro del marco · 100% offline</p>
  </main>

</div>
</body>
</html>
