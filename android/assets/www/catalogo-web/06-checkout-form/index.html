<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<title>FORGE CORE STOCK · Datos de entrega</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <!-- 1 · cabecera + estado vivo -->
  <header class="topbar">
    <a class="icon-btn" href="../05-carrito/" aria-label="Volver al carrito">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg>
    </a>
    <span class="brand">
      <b>FORGE CORE STOCK</b>
      <span class="status"><i class="dot" aria-hidden="true"></i>NÚCLEO ACTIVO</span>
    </span>
    <span class="icon-btn" aria-label="Carrito, 3 productos">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h2l2.1 9.6a1.6 1.6 0 0 0 1.6 1.3h7.6a1.6 1.6 0 0 0 1.6-1.2L20.5 8H6.4"/><circle cx="10" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg>
      <span class="count">3</span>
    </span>
  </header>

  <!-- progreso 6/8 -->
  <div class="step"><span>PASO 6/8</span><span>ENTREGA</span></div>
  <div class="bar p6" role="progressbar" aria-label="Paso 6 de 8" aria-valuenow="6" aria-valuemin="1" aria-valuemax="8"><i></i></div>

  <main>
    <h1 class="title">Datos de entrega</h1>
    <p class="lead">Completa tu dirección para el despacho a domicilio en Chile.</p>

    <form class="form" novalidate>

      <!-- nombre -->
      <label class="field">
        <span class="field-k">Nombre completo</span>
        <input class="input" type="text" value="Juan Pérez" autocomplete="name">
      </label>

      <!-- RUT + teléfono -->
      <div class="row">
        <label class="field">
          <span class="field-k">RUT</span>
          <input class="input input--mono" type="text" value="12.345.678-9" inputmode="numeric" autocomplete="off">
        </label>
        <label class="field">
          <span class="field-k">Teléfono</span>
          <input class="input input--mono" type="tel" value="+56 9 8123 4567" autocomplete="tel">
        </label>
      </div>

      <!-- dirección -->
      <label class="field">
        <span class="field-k">Dirección</span>
        <input class="input" type="text" value="Av. Providencia 1234, Depto 56" autocomplete="street-address">
      </label>

      <!-- región / comuna -->
      <div class="row row--geo">
        <label class="field">
          <span class="field-k">Región</span>
          <select class="input input--select">
            <option selected>Región Metropolitana</option>
            <option>Región de Valparaíso</option>
            <option>Región del Biobío</option>
            <option>Región de Los Lagos</option>
          </select>
        </label>
        <label class="field">
          <span class="field-k">Comuna</span>
          <select class="input input--select">
            <option selected>Providencia</option>
            <option>Santiago</option>
            <option>Ñuñoa</option>
            <option>Las Condes</option>
          </select>
        </label>
      </div>

      <!-- tipo de entrega -->
      <fieldset class="ship">
        <legend class="field-k">Tipo de entrega</legend>

        <label class="opt opt--on">
          <input class="opt-radio" type="radio" name="entrega" checked>
          <span class="opt-body">
            <b>Despacho 24H</b>
            <span>Llega al día hábil siguiente · Región Metropolitana</span>
          </span>
          <span class="opt-price">$3.990</span>
        </label>

        <label class="opt">
          <input class="opt-radio" type="radio" name="entrega">
          <span class="opt-body">
            <b>Retiro en tienda</b>
            <span>Bodega FORGE · Av. Italia 880 · 3 días hábiles</span>
          </span>
          <span class="opt-price">Gratis</span>
        </label>
      </fieldset>

      <!-- seguridad -->
      <p class="safe">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="9.5" rx="2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg>
        Compra protegida y datos encriptados
      </p>

    </form>
  </main>

  <!-- acción fija -->
  <div class="paybar">
    <div class="paybar-info">
      <span>Total CLP</span>
      <b>$10.570</b>
    </div>
    <a class="btn btn-neon" href="../07-pasarela-pago/">Continuar al pago</a>
  </div>

</div>
</body>
</html>
